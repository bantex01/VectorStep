{# Shared small UI fragments used across multiple templates. #}

{% macro feedback_badge(outcome) -%}
{% if outcome == "correct" %}
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-green-950 text-green-400 ring-1 ring-inset ring-green-800 text-xs leading-none" title="Marked correct">✓</span>
{%- elif outcome == "partial" %}
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-amber-950 text-amber-400 ring-1 ring-inset ring-amber-800 text-xs leading-none" title="Marked partial">±</span>
{%- elif outcome == "incorrect" %}
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-red-950 text-red-400 ring-1 ring-inset ring-red-800 text-xs leading-none" title="Marked incorrect">✕</span>
{%- else %}
<span class="inline-flex items-center justify-center w-5 h-5 rounded-full text-zinc-600 ring-1 ring-inset ring-zinc-700 text-xs leading-none" title="Not yet marked">–</span>
{%- endif %}
{%- endmacro %}
