<div class="px-4 py-3 border-t border-zinc-800"
     x-data="stepFeedbackWidget('{{ run.id }}', '{{ sname }}', '{{ sfb.outcome or '' }}', {{ (sfb.notes or '') | tojson }})">
  <div class="flex items-center gap-2 mb-2">
    <span class="text-xs font-semibold text-zinc-500 uppercase tracking-wide">Step accuracy</span>
    <template x-if="saved && outcome">
      <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ring-1 ring-inset"
            :class="{
              'bg-green-950 text-green-400 ring-green-800': outcome === 'correct',
              'bg-amber-950 text-amber-400 ring-amber-800': outcome === 'partial',
              'bg-red-950 text-red-400 ring-red-800': outcome === 'incorrect'
            }"
            x-text="outcome.charAt(0).toUpperCase() + outcome.slice(1)"></span>
    </template>
  </div>
  <div class="flex flex-wrap items-center gap-2">
    <button @click="select('correct')"
            class="px-2.5 py-1 rounded-md text-xs font-medium border transition-colors"
            :class="outcome === 'correct' ? 'bg-green-950 text-green-300 border-green-700' : 'bg-zinc-800 text-zinc-400 border-zinc-700 hover:border-green-800 hover:text-green-400'">Correct</button>
    <button @click="select('partial')"
            class="px-2.5 py-1 rounded-md text-xs font-medium border transition-colors"
            :class="outcome === 'partial' ? 'bg-amber-950 text-amber-300 border-amber-700' : 'bg-zinc-800 text-zinc-400 border-zinc-700 hover:border-amber-800 hover:text-amber-400'">Partial</button>
    <button @click="select('incorrect')"
            class="px-2.5 py-1 rounded-md text-xs font-medium border transition-colors"
            :class="outcome === 'incorrect' ? 'bg-red-950 text-red-300 border-red-700' : 'bg-zinc-800 text-zinc-400 border-zinc-700 hover:border-red-800 hover:text-red-400'">Incorrect</button>
    <button @click="submit()" x-show="outcome" x-cloak :disabled="submitting"
            class="ml-1 px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white transition-colors"
            x-text="submitting ? 'Saving…' : (saved ? 'Update' : 'Save')"></button>
    <span x-show="saved && !submitting" x-transition class="text-xs text-green-400">Saved</span>
    <span x-show="error" x-text="error" class="text-xs text-red-400"></span>
  </div>
  <div x-show="outcome" x-cloak class="mt-2">
    <input x-model="notes" type="text" placeholder="Optional note…"
           class="w-full bg-zinc-800 border border-zinc-700 rounded-md px-2.5 py-1 text-xs text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500">
  </div>
</div>
