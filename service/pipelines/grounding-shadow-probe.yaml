# Grounding shadow-mode data-gathering probe (SPEC-grounding-shadow.md / Phase 0).
#
# Purpose: give a real, safely-repeatable pipeline a `grounding:` block so VectorStep
# starts accumulating real S-vs-G divergence data — see the brief doc one level up
# (GROUNDING-SHADOW-TESTING.md) for what we're expecting to see and how it feeds
# into the Phase 1 grounding-cap decision.
#
# Copied from jira-problem-review.yaml (the "problem-manager" step) because its
# agent is one of the few actually configured on the current gateway (see
# VectorStep-Gateway/agents/) — several other pipelines in this directory reference
# agents (first-line-support, sre-investigation, principal-sre) that aren't
# currently wired up and would fail at run time.
#
# Deliberately DIFFERENT from jira-problem-review.yaml in three ways, all
# safety-motivated:
#   1. No `schedule:` block. This only ever runs via the "Run now" button
#      (POST /pipelines/{name}/run) — never on a cron, so repeated manual runs
#      for data-gathering never collide with (or duplicate) the real weekly review.
#   2. `trigger.match` is a synthetic, never-real value rather than `{}` — an
#      empty match block matches EVERY incoming webhook (see resolver.py), which
#      would be dangerous on a probe pipeline nobody's watching closely. This one
#      can never fire from real ingestion traffic, on purpose.
#   3. Only the `problem-manager` step is included, not `engineering-manager`.
#      problem-manager is explicitly read-only (search + report, never writes to
#      Jira — see its soul.md). engineering-manager is the step that creates real
#      Jira issues/epics; running that repeatedly just to gather grounding data
#      would create real duplicate tickets. If you want grounding on a
#      side-effecting step later, point jira_project at a sandbox project first.
#
# `stage: production` is intentional (not testing!) even though this is a "test"
# pipeline in spirit — vectorstep_step_grounding_score and every other aggregate view
# are production-scoped (see README §3c), so a stage:testing probe would silently
# produce zero visible data. Nothing here has an externally-visible side effect
# (no notifications will fire — trigger can't match; problem-manager is
# read-only), so production-scoping is safe.
#
# To activate grounding itself: the `grounding-judge` agent referenced below is
# staged at ../grounding-judge/ (one level up from this repo) and needs to be
# copied into VectorStep-Gateway/agents/grounding-judge/ and the gateway reloaded
# (SIGHUP or restart) before this step's grounding pass can actually run. Until
# then the step still runs fine — grounding just soft-fails and records G=null
# (see _run_grounding's error handling), same as any other unreachable agent.

name: grounding-shadow-probe
description: Read-only Jira problem review, run manually, with grounding enabled — Phase 0 shadow-mode data-gathering probe for the confidence/trust overhaul.
version: 1
stage: production   # intentional — see note above; nothing here has a real side effect

trigger:
  match:
    service: __grounding-shadow-probe-manual-only__   # never a real label value — this pipeline only runs via "Run now"

vars:
  jira_project: PORK
  jira_project_url: https://alexfdalton.atlassian.net/jira/software/projects/PORK/
  review_window_days: "7"
  label_filter: ""

steps:
  - name: problem-manager
    executor: gateway
    timeout_seconds: 1200
    executor_config:
      agent: problem-manager
      session_key: "agent:problem-manager:{{pipeline_run_id}}:grounding-probe"
    confidence_threshold: 0.60
    on_low_confidence: escalate
    on_abort: notify
    prompt_template: |
      Run this week's problem review for the {{jira_project}} Jira project.

      Jira project: {{jira_project}} ({{jira_project_url}})
      Review window: last {{review_window_days}} days
      Additional label/component filters: {{label_filter | default('none')}}

      Follow your standard workflow — search the board, analyse the full
      ticket set for recurring issues, concentrations, reopens, stale/blocked
      tickets, and emerging trends — then return your report exactly as
      described in your instructions.
    # NEW — grounding shadow: after this step runs, a blind judge checks how
    # many of its load-bearing claims (recurring patterns, ticket clusters,
    # inferred root causes) are actually backed by tool results in the trace
    # (the Jira/Grafana searches it ran), vs asserted. Recorded only — this
    # never affects confidence_threshold or on_low_confidence above.
    grounding:
      agent: grounding-judge

notifications:
  escalate:
    channel: telegram
    template: |
      ⚠️ Grounding shadow probe escalated: {{pipeline_name}}
      Step: {{current_step}}
      Reason: {{escalation_reason}}
      Summary: {{step_summary}}
  notify:
    channel: telegram
    template: |
      Grounding shadow probe aborted: {{pipeline_name}}
      Step: {{current_step}}
