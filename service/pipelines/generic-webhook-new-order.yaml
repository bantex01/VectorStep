name: new-order
description: Test pipeline for generic webhook source — order intake followed by personalised customer comms
version: 1

trigger:
  match:
    event: order.placed

context_template:
  include:
    - summary
    - metadata.order_id
    - metadata.customer_name
    - metadata.customer_email
    - metadata.items
    - metadata.total

steps:
  - name: order-intake
    executor: gateway
    executor_config:
      agent: order-intake
      session_key: "agent:order-intake:{{pipeline_run_id}}"
    confidence_threshold: 0.70
    on_low_confidence: escalate
    on_abort: notify
    prompt_template: |
      A new order has been placed. Review it and produce a dispatch brief and a
      customer profile summary for the next step.

      Order summary: {{summary}}
      Order ID: {{order_id}}
      Customer: {{customer_name}} ({{customer_email}})
      Items: {{items}}
      Order total: ${{total}}

      Set confidence based on how completely you could reason about the order —
      did you have enough data to produce a useful brief and profile?

      Return JSON only, no other text:
      {
        "confidence": 0.0,
        "summary": "One sentence describing the order",
        "dispatch_brief": "What needs to be picked, packed and shipped",
        "customer_profile": "Short profile based on what they bought — interests, category affinity, likely use case",
        "next_step_context": "Concise brief for the customer comms agent",
        "reasoning": {
          "supports": "Why this order is straightforward to process",
          "contradicts": "Anything unusual or worth flagging",
          "assumptions": "What you assumed in the absence of data"
        }
      }

  - name: customer-comms
    executor: gateway
    executor_config:
      agent: customer-comms
      session_key: "agent:customer-comms:{{pipeline_run_id}}"
    confidence_threshold: 0.70
    on_low_confidence: escalate
    on_abort: notify
    prompt_template: |
      A customer has just placed an order. Draft a personalised follow-up email
      with 2-3 tailored product recommendations based on what they bought.

      Customer: {{customer_name}} ({{customer_email}})
      Order ID: {{order_id}}
      Items purchased: {{items}}
      Order total: ${{total}}

      Intake summary: {{steps.order_intake.summary}}
      Customer profile: {{steps.order_intake.customer_profile}}
      Context: {{steps.order_intake.next_step_context}}

      Set confidence based on how well you could tailor the email and recommendations
      to this specific customer and their purchase.

      Return JSON only, no other text:
      {
        "confidence": 0.0,
        "proceed": false,
        "proceed_reason": "Customer comms drafted — pipeline complete",
        "summary": "One sentence: what was drafted and for whom",
        "email_subject": "...",
        "email_body": "...",
        "recommendations": ["product 1", "product 2", "product 3"],
        "next_step_context": "",
        "reasoning": {
          "supports": "Why these recommendations fit the customer",
          "contradicts": "Anything that made personalisation harder",
          "assumptions": "What you assumed about the customer's preferences"
        }
      }

notifications:
  escalate:
    channel: telegram
    template: |
      ⚠️ Escalated: {{pipeline_name}}
      Step: {{current_step}}
      Reason: {{escalation_reason}}{% if confidence is not none %} — confidence {{confidence | round(2)}} below threshold {{confidence_threshold}}{% endif %}
      Summary: {{step_summary}}
  stopped:
    channel: telegram
    template: |
      ✅ Complete: {{pipeline_name}}
      Customer: {{customer_name}}
      Order: #{{order_id}}
      Summary: {{step_summary}}
  notify:
    channel: telegram
    template: |
      Aborted: {{pipeline_name}}
      Step: {{current_step}}
