# yaml-language-server: $schema=
name: otel-triage-test
description: Two-step test pipeline for OTEL Collector alerts — triage then SRE investigation
version: 1

trigger:
  match:
    severity: critical
    service: otel-collector

vars:
  # First-line triage
  confluence_space: SOC
  confluence_space_url: https://alexfdalton.atlassian.net/wiki/spaces/SOC/
  confluence_service_docs_folder: Service Documentation
  confluence_service_doc_name: OTEL Collector
  service_doc_schema: "Owner, Business Criticality, SLO (Scrape Duration), SLO (Availability), Dependencies (Upstream + Downstream), Failure Impact, Known Fragility"
  jira_project: OC
  jira_project_url: https://alexfdalton.atlassian.net/jira/software/projects/OC/

  # SRE investigation
  grafana_mcp_server: grafana_production
  grafana_url: https://alexfdalton.grafana.net/
  grafana_dashboard: OTEL Collector
  grafana_service_labels: "job=otelcol-contrib, component=adalton-tools-otel-collector"
  alerting_metric: scrape_duration_seconds

context_template:
  include:
    - severity
    - labels.service
    - labels.environment
    - summary
    - metadata.starts_at

steps:
  - name: first-line-triage
    executor: openclaw
    executor_config:
      agent: first-line-support
      session_key: "agent:first-line-support:{{pipeline_run_id}}"
    confidence_threshold: 0.60
    on_low_confidence: escalate
    on_abort: notify
    prompt_template: |
      Alert severity: {{severity}}
      Service: {{labels.service}}
      Environment: {{labels.environment}}
      Summary: {{summary}}

      Confluence space: {{confluence_space}} ({{confluence_space_url}})
      Service doc: "{{confluence_service_doc_name}}" in folder "{{confluence_service_docs_folder}}"
      Expected doc sections: {{service_doc_schema}}
      Jira project: {{jira_project}} ({{jira_project_url}})

      Set confidence based on how completely you executed the tasks — did you
      find the service doc, raise the ticket, and produce a useful brief?
      Not a rating of the alert severity.

      Once you have looked up the service doc and raised the Jira ticket,
      respond with ONLY this JSON and nothing else:
      {
        "confidence": 0.0,
        "doc_found": true,
        "summary": "One sentence: what is happening and how serious",
        "jira_ticket": "{{jira_project}}-<number>",
        "next_step_context": "Focused investigation brief for the next step",
        "reasoning": {
          "supports": "Evidence that makes this alert credible",
          "contradicts": "Evidence that suggests noise or false positive",
          "assumptions": "What you are assuming in the absence of data"
        }
      }

  - name: sre-investigation
    executor: openclaw
    timeout_seconds: 1200 
    executor_config:
      agent: sre-investigation
      session_key: "agent:sre-investigation:{{pipeline_run_id}}"
    confidence_threshold: 0.60
    on_low_confidence: escalate
    on_abort: notify
    prompt_template: |
      Alert severity: {{severity}}
      Service: {{labels.service}}
      Environment: {{labels.environment}}
      Summary: {{summary}}
      Alert started: {{starts_at}}

      Triage summary: {{steps.first_line_triage.summary}}
      Investigation brief: {{steps.first_line_triage.next_step_context}}
      Jira ticket: {{steps.first_line_triage.jira_ticket}} ({{jira_project_url}})

      Grafana MCP server: {{grafana_mcp_server}}
      Grafana instance: {{grafana_url}}
      Grafana dashboard: {{grafana_dashboard}}
      Service labels: {{grafana_service_labels}}
      Alerting metric: {{alerting_metric}}

      Query Grafana for the above service. Look at the alerting metric and the
      full RED picture (Rate, Errors, Duration) plus Saturation over the last
      60 minutes. Focus on what the triage brief identified as the priority.

      Once you have your findings, update the Jira ticket with a comment
      summarising what the metrics show and your probable cause assessment.

      Respond with ONLY this JSON and nothing else:
      {
        "confidence": 0.0,
        "proceed": true,
        "proceed_reason": "One sentence: why the pipeline should continue or stop here",
        "summary": "One sentence: what the data shows",
        "jira_ticket": "{{steps.first_line_triage.jira_ticket}}",
        "findings": "Key metrics observed — be specific with values and timeframes",
        "probable_cause": "Most likely explanation based on the data",
        "next_step_context": "What a remediation agent should do — specific and bounded",
        "reasoning": {
          "supports": "Metrics that confirm the problem",
          "contradicts": "Anything that suggests a different cause or smaller scope",
          "assumptions": "Gaps in the data you are working around"
        }
      }

notifications:
  escalate:
    channel: telegram
    template: |
      ⚠️ Escalated: {{pipeline_name}}
      Service: {{labels.service}} ({{environment}})
      Step: {{current_step}}
      Reason: {{escalation_reason}}{% if confidence is not none %} — confidence {{confidence | round(2)}} below threshold {{confidence_threshold}}{% endif %}
      Summary: {{step_summary}}
      {% if contradicts %}Contradicts: {{contradicts}}{% endif %}
  stopped:
    channel: telegram
    template: |
      ✅ Stopped: {{pipeline_name}}
      Service: {{labels.service}} ({{environment}})
      Step: {{current_step}}
      Summary: {{step_summary}}
      {% if proceed_reason %}Reason: {{proceed_reason}}{% endif %}
  notify:
    channel: telegram
    template: |
      Aborted: {{pipeline_name}}
      Service: {{labels.service}}
      Step: {{current_step}}
