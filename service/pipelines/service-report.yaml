name: service-report
description: On-demand service health report — queries Grafana, creates a Confluence report page
version: 1

# source: generic only — always invoked by explicit name from the Telegram /run command.
# Trigger: /run service-report service=<name> environment=<env>
trigger:
  match:
    source: generic

vars:
  confluence_space: SOC
  confluence_space_url: https://alexfdalton.atlassian.net/wiki/spaces/SOC/
  confluence_reports_folder: Service Reports
  grafana_mcp_server: grafana_production
  grafana_url: https://alexfdalton.grafana.net/

context_template:
  include:
    - metadata.service
    - metadata.environment

steps:
  - name: gather-data
    executor: gateway 
    timeout_seconds: 1200
    executor_config:
      agent: sre-investigation
      session_key: "agent:sre-investigation:{{pipeline_run_id}}"
    confidence_threshold: 0.60
    on_low_confidence: escalate
    prompt_template: |
      You are gathering data for an on-demand service health report.

      Service: {{service | default('unknown')}}
      Environment: {{environment | default('prod')}}

      Grafana MCP server: {{grafana_mcp_server}}
      Grafana instance: {{grafana_url}}

      Query Grafana for the service over the last 60 minutes.
      Collect: current status, key RED metrics (Rate, Errors, Duration),
      any active alerts or anomalies, and any notable trends.

      Return ONLY this JSON and nothing else:
      {
        "confidence": 0.0,
        "summary": "One sentence: overall health status",
        "metrics_summary": "Key metrics observed — include specific values and timeframes",
        "active_alerts": "Any active alerts or anomalies, or 'none'",
        "health_status": "healthy | degraded | critical",
        "next_step_context": "Concise brief for the report writer"
      }

  - name: write-report
    executor: gateway 
    timeout_seconds: 1200
    executor_config:
      agent: first-line-support   # needs Confluence MCP access
      session_key: "agent:first-line-support:{{pipeline_run_id}}"
    confidence_threshold: 0.60
    on_low_confidence: escalate
    prompt_template: |
      You are creating a service health report page in Confluence.

      Service: {{service | default('unknown')}}
      Environment: {{environment | default('prod')}}

      Health status: {{steps.gather_data.health_status}}
      Summary: {{steps.gather_data.summary}}
      Metrics: {{steps.gather_data.metrics_summary}}
      Active alerts: {{steps.gather_data.active_alerts}}
      Detail: {{steps.gather_data.next_step_context}}

      Confluence space: {{confluence_space}} ({{confluence_space_url}})
      Parent folder: {{confluence_reports_folder}}

      Create a new page under "{{confluence_reports_folder}}" titled
      "Service Report — {{service | default('unknown')}} — <today's date>".
      The page should include: health status badge, metrics summary, active alerts,
      and any recommendations. If you create the page successfully, you MUST set "proceed" to false to end the pipeline, as the report is the final deliverable.

      Return ONLY this JSON and nothing else:
      {
        "confidence": 0.0,
        "proceed": false,
        "proceed_reason": "Report created — pipeline complete",
        "summary": "Service report created for {{service | default('unknown')}}",
        "doc_url": "Full URL of the created Confluence page",
        "next_step_context": ""
      }

notifications:
  completed:  
    channel: telegram
    template: |
      ✅ Service report ready: <b>{{service}}</b>
      {{step_summary}}
      {{steps.write_report.doc_url}}
  stopped:  
    channel: telegram
    template: |
      ✅ Service report ready: <b>{{service}}</b>
      {{step_summary}}
      {{steps.write_report.doc_url}}
  escalate:
    channel: telegram
    template: |
      ⚠️ Service report failed at step: <b>{{current_step}}</b>
      Service: {{service}}
      Reason: {{escalation_reason}}
      {{step_summary}}
