name: sre-investigation-verified
description: >
  SRE Grafana investigation with an always-on principal-sre reviewer.
  Identical to sre-investigation but adds a minimum-strategy verifier that
  fires on every run. Use this when you want an independent second opinion
  on every investigation result before the pipeline proceeds.

  Same required vars as sre-investigation.
tags:
  - investigation
  - grafana
  - jira
  - openclaw
  - verified

executor: openclaw
executor_config:
  agent: sre-investigation
  session_key: "agent:sre-investigation:{{pipeline_run_id}}:{{current_step}}"

confidence_threshold: 0.60
on_low_confidence: escalate
on_abort: notify
timeout_seconds: 1200

verifier:
  executor: openclaw
  executor_config:
    agent: principal-sre
    session_key: "agent:principal-sre:{{pipeline_run_id}}:{{current_step}}-verify"
  combination_strategy: minimum
  trigger:
    always: true

prompt_template: |
  Alert severity: {{severity}}
  Service: {{labels.service}}
  Environment: {{labels.environment}}
  Summary: {{summary}}

  Triage summary: {{steps.first_line_triage.summary}}
  Investigation brief: {{steps.first_line_triage.next_step_context}}
  Jira ticket: {{steps.first_line_triage.jira_ticket}} ({{jira_project_url}})

  Grafana MCP server: {{grafana_mcp_server}}
  Grafana instance: {{grafana_url}}
  Grafana dashboard: {{grafana_dashboard}}
  Service labels: {{grafana_service_labels}}
  Alerting metric: {{alerting_metric}}

  Query Grafana for the above service. Look at the alerting metric and the
  full RED picture (Rate, Errors, Duration) plus Saturation over the last
  60 minutes. Focus on what the triage brief identified as the priority.
  Update the Jira ticket with a comment summarising what the metrics show.

  Return ONLY this JSON, no other text:
  {
    "confidence": 0.0,
    "proceed": true,
    "proceed_reason": "One sentence: why the pipeline should continue or stop here",
    "summary": "One sentence: what the data shows",
    "jira_ticket": "{{steps.first_line_triage.jira_ticket}}",
    "findings": "Key metrics observed — specific values and timeframes",
    "probable_cause": "Most likely explanation based on the data",
    "next_step_context": "What a remediation agent should do — specific and bounded",
    "reasoning": {
      "supports": "Metrics that confirm the problem",
      "contradicts": "Anything that suggests a different cause or smaller scope",
      "assumptions": "Gaps in the data you are working around"
    }
  }
