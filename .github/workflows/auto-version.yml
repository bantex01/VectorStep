name: auto-version

# Manual-only during pre-launch. At public launch, flip the trigger below to:
#
#   on:
#     push:
#       branches: [main]
#
# — a one-line diff, nothing else changes. See RELEASING.md for the manual
# minor/major bump procedure, which always takes precedence over this
# workflow's patch bump.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: bump
        run: |
          set -euo pipefail
          latest=$(git tag --list 'v*' --merged HEAD | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            latest="v0.0.0"
          fi
          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"
          new_tag="v${major}.${minor}.$((patch + 1))"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new_tag"
          git push origin "$new_tag"

          echo "new_tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.bump.outputs.new_tag }}" --generate-notes
