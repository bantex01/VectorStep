# Minimal working config for the docker-compose evaluation stack.
# See ../../samples/config.yaml.example for the full annotated reference.

server:
  host: 0.0.0.0
  port: 8000

database:
  url: sqlite+aiosqlite:////data/db/runs.db   # note: four slashes = absolute path

pipeline_config_dir: /data/pipelines
step_library_dir: /data/steps

artifacts:
  dir: /data/artifacts

logging:
  dir: /data/logs

executors:
  gateway:
    url: ws://gateway:18780/rpc
    token: ${VECTORSTEP_GATEWAY_TOKEN}
    rest_url: http://gateway:18780
