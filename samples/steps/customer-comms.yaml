name: customer-comms
description: >
  Drafts a personalised post-purchase follow-up email with 2–3 tailored
  product recommendations based on what the customer bought.

  Designed to follow order-intake. References steps.order_intake.* by
  default — override prompt_template if your preceding step has a different
  name. Sets proceed=false as it is the terminal step of an order pipeline.
tags:
  - order
  - comms
  - email
  - gateway

executor: gateway
executor_config:
  agent: customer-comms
  session_key: "agent:customer-comms:{{pipeline_run_id}}:{{current_step}}"

confidence_threshold: 0.70
on_low_confidence: escalate
on_abort: notify
timeout_seconds: 120

prompt_template: |
  A customer has just placed an order. Draft a personalised follow-up email
  with 2–3 tailored product recommendations based on what they bought.

  Customer: {{customer_name}} ({{customer_email}})
  Order ID: {{order_id}}
  Items purchased: {{items}}
  Order total: ${{total}}

  Intake summary: {{steps.order_intake.summary}}
  Customer profile: {{steps.order_intake.customer_profile}}
  Context: {{steps.order_intake.next_step_context}}

  Set confidence based on how well you could tailor the email and
  recommendations to this specific customer and their purchase.

  Return JSON only, no other text:
  {
    "confidence": 0.0,
    "proceed": false,
    "proceed_reason": "Customer comms drafted — pipeline complete",
    "summary": "One sentence: what was drafted and for whom",
    "email_subject": "...",
    "email_body": "...",
    "recommendations": ["product 1", "product 2", "product 3"],
    "next_step_context": "",
    "reasoning": {
      "supports": "Why these recommendations fit the customer",
      "contradicts": "Anything that made personalisation harder",
      "assumptions": "What you assumed about the customer's preferences"
    }
  }
