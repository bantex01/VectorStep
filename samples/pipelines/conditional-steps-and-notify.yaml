# Sample: Conditional Steps, on_failure Policy, and Notify Executor
#
# Demonstrates three pipeline features:
#
#   1. when: — conditional step execution via Jinja2 expression
#      Steps are skipped (not failed) when the condition evaluates to false.
#
#   2. on_failure: continue — allow non-critical steps to fail without aborting
#      the pipeline. Useful for enrichment steps where partial failure is OK.
#
#   3. executor: notify — first-class outbound webhook notification step with
#      structured payload templating (Slack, PagerDuty, Teams, Jira, etc.)
#
#   4. on_failure.webhook — per-step callback fired when a step fails,
#      regardless of whether the pipeline continues or aborts.
#
# Replace the agent names, URLs, and tokens with your own values.

name: demo-conditional-notify
description: Demo of conditional steps, failure policies, and outbound notifications
version: 1

trigger:
  match:
    source: demo                    # Only trigger on payloads with source=demo

steps:
  # ── Step 1: Primary triage (always runs) ─────────────────────────────────
  - name: triage
    executor: gateway
    executor_config:
      agent: sre-triage
    prompt_template: |
      Triage the following alert and respond with JSON.
      Alert: {{context.summary}}
      Severity: {{context.severity}}

  # ── Step 2: Deep investigation (only for high-severity alerts) ───────────
  # The `when:` expression is a Jinja2 condition evaluated against the step
  # context. If false, the step is skipped (logged as "step_skipped") and the
  # pipeline continues to the next step.
  - name: deep-investigation
    executor: gateway
    executor_config:
      agent: sre-investigator
    when: "steps.triage.output.confidence < 0.7 or context.severity == 'critical'"
    prompt_template: |
      Perform a deep investigation for this alert.
      Prior triage summary: {{steps.triage.output.summary}}

  # ── Step 3: Enrichment from external API (optional, non-critical) ────────
  # on_failure: continue means if this step fails (e.g. external API is down),
  # the pipeline keeps running. The step result is recorded as "failed" in the
  # run history but does not abort subsequent steps.
  #
  # An on_failure.webhook fires immediately when the step fails — regardless
  # of the policy — so ops can know about the enrichment failure without the
  # pipeline itself being marked failed.
  - name: enrich-from-cmdb
    executor: webhook
    on_failure: continue
    executor_config:
      url: "https://cmdb.internal/api/enrich"
      headers:
        Authorization: "Bearer ${CMDB_API_TOKEN}"
      content_type: application/json
    on_failure:
      policy: continue
      webhook:
        url: "${SLACK_WEBHOOK_URL}"
        payload:
          text: ":warning: CMDB enrichment failed for alert `{{context.summary}}`"
    prompt_template: |
      {"alert": "{{context.summary}}", "service": "{{context.labels.service}}"}

  # ── Step 4: Notify on PagerDuty — only if severity is critical ───────────
  # executor: notify sends a structured payload to an outbound webhook.
  # Unlike executor: webhook (which uses prompt_template as the raw body),
  # executor: notify takes a payload dict where every string value is a
  # Jinja2 template. Perfect for Slack blocks, PD events, Teams cards, etc.
  #
  # This step is skipped entirely for non-critical alerts via when:.
  - name: alert-pagerduty
    executor: notify
    when: "context.severity == 'critical'"
    on_failure: continue           # notification failure should never abort the run
    executor_config:
      url: "${PAGERDUTY_EVENTS_URL}"
      headers:
        Authorization: "Token token=${PAGERDUTY_TOKEN}"
        Content-Type: application/json
      payload:
        routing_key: "${PAGERDUTY_ROUTING_KEY}"
        event_action: trigger
        payload:
          summary: "{{context.summary}}"
          severity: "{{context.severity}}"
          source: pork
          custom_details:
            triage_summary: "{{steps.triage.output.summary}}"
            confidence: "{{steps.triage.output.confidence}}"

  # ── Step 5: Notify Slack — always runs (summary notification) ────────────
  - name: notify-slack
    executor: notify
    on_failure: continue           # notification failure should never abort the run
    executor_config:
      url: "${SLACK_WEBHOOK_URL}"
      payload:
        blocks:
          - type: section
            text:
              type: mrkdwn
              text: |
                *Alert:* {{context.summary}}
                *Severity:* {{context.severity}}
                *Triage:* {{steps.triage.output.summary}}
        attachments:
          - color: "{{context.severity == 'critical' and 'danger' or 'warning'}}"
            text: "Pipeline: demo-conditional-notify"

notifications:
  # `log` channel — always available, no config required.
  # Renders the template and emits it to the application logger.
  # Use as a zero-dependency fallback or alongside other channels.
  escalate:
    - channel: log
      template: |
        ESCALATED: {{pipeline_name}} — {{step_summary}}
        Alert: {{context.summary}} (confidence {{confidence | round(2)}})
      config:
        level: error          # debug | info | warning | error | critical (default: warning)
        logger: pork.notifications  # logger name (default: pork.notifications)
    - channel: telegram
      template: |
        🚨 Alert triage failed with low confidence.
        Alert: {{context.summary}}
        Reason: {{step_summary}}

  # A log notification on the `notify` action (budget exceeded, manual abort, etc.)
  notify:
    - channel: log
      template: "PIPELINE ABORTED: {{pipeline_name}} — {{step_summary}}"
      config:
        level: warning
